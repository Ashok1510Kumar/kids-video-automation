name: GTA 6 AI Auto-Clipper (OpenSource Clipping)

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube Video Privacy (public, private, unlisted)'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Deno (for yt-dlp JavaScript engine)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install System Dependencies (FFmpeg & Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core nodejs git

      - name: Install CPU PyTorch & AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install faster-whisper mediapipe google-genai

      - name: Run OpenSource AI Clipper & YouTube Publisher
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_FLOW_ID }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          python run_gta6_clipper.py

      - name: Upload All Generated GTA 6 Clips as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-viral-clips
          path: |
            *.mp4
            opensource-clipping/output/**/*.mp4
          retention-days: 14
